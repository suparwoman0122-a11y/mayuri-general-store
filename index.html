<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mayuri General Store</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
      font-family:Arial,sans-serif;
    }

    body{
      background:#fff9f7;
      color:#35131e;
    }

    header{
      position:sticky;
      top:0;
      z-index:1000;
      background:#4b1020;
      padding:13px 16px;
      box-shadow:0 3px 15px rgba(0,0,0,.25);
    }

    .nav{
      max-width:1100px;
      margin:auto;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }

    .logo{
      color:#fff;
      font-size:20px;
      font-weight:800;
    }

    .cart-button{
      border:0;
      background:#d4af37;
      color:#35131e;
      padding:10px 15px;
      border-radius:25px;
      font-weight:bold;
      cursor:pointer;
    }

    .hero{
      background:linear-gradient(135deg,#3b0b18,#781d38);
      color:white;
      text-align:center;
      padding:60px 18px;
    }

    .hero h1{
      font-size:clamp(32px,8vw,58px);
      margin-bottom:12px;
    }

    .hero p{
      color:#f5d98b;
      font-size:16px;
    }

    .section{
      max-width:1100px;
      margin:auto;
      padding:35px 15px;
    }

    .title{
      text-align:center;
      color:#4b1020;
      margin-bottom:22px;
    }

    .categories{
      display:flex;
      gap:9px;
      overflow-x:auto;
      padding:5px 0 15px;
      scrollbar-width:none;
    }

    .categories::-webkit-scrollbar{
      display:none;
    }

    .category{
      flex:0 0 auto;
      border:1px solid #d4af37;
      background:#fff;
      color:#4b1020;
      padding:9px 14px;
      border-radius:25px;
      cursor:pointer;
      font-weight:600;
    }

    .category.active{
      background:#4b1020;
      color:#fff;
    }

    .products{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:18px;
    }

    .card{
      background:#fff;
      border:1px solid #ead49a;
      border-radius:18px;
      padding:14px;
      box-shadow:0 5px 20px rgba(75,16,32,.09);
      overflow:hidden;
    }

    .product-image{
      height:170px;
      border-radius:14px;
      background:linear-gradient(135deg,#fff0f3,#f8e0a8);
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:65px;
      margin-bottom:13px;
    }

    .card h3{
      color:#4b1020;
      font-size:17px;
      margin-bottom:7px;
    }

    .desc{
      color:#777;
      font-size:13px;
      min-height:34px;
    }

    .price{
      margin-top:10px;
    }

    .old{
      color:#888;
      text-decoration:line-through;
      margin-right:5px;
    }

    .new{
      color:#4b1020;
      font-size:21px;
      font-weight:bold;
    }

    .off{
      display:inline-block;
      background:#d4af37;
      color:#35131e;
      padding:4px 7px;
      border-radius:7px;
      font-size:11px;
      font-weight:bold;
      margin-top:5px;
    }

    .add{
      width:100%;
      border:0;
      background:#4b1020;
      color:#fff;
      padding:11px;
      border-radius:10px;
      margin-top:11px;
      font-weight:bold;
      cursor:pointer;
    }

    footer{
      background:#35131e;
      color:white;
      text-align:center;
      padding:30px 15px;
      margin-top:20px;
    }

    .overlay{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.65);
      z-index:2000;
      display:none;
      align-items:flex-end;
      justify-content:center;
    }

    .overlay.show{
      display:flex;
    }

    .modal{
      width:100%;
      max-width:560px;
      max-height:92vh;
      overflow-y:auto;
      background:#fff;
      border-radius:22px 22px 0 0;
      padding:20px;
    }

    .modal-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin-bottom:15px;
    }

    .close{
      border:0;
      background:#eee;
      width:35px;
      height:35px;
      border-radius:50%;
      font-size:20px;
      cursor:pointer;
    }

    .cart-item{
      display:flex;
      justify-content:space-between;
      gap:10px;
      padding:13px 0;
      border-bottom:1px solid #eee;
    }

    .quantity{
      display:flex;
      align-items:center;
      gap:7px;
      margin-top:8px;
    }

    .quantity button{
      border:0;
      background:#4b1020;
      color:#fff;
      width:29px;
      height:29px;
      border-radius:7px;
      cursor:pointer;
    }

    .remove{
      width:auto!important;
      background:none!important;
      color:#c00!important;
    }

    .total{
      display:flex;
      justify-content:space-between;
      font-size:21px;
      font-weight:bold;
      color:#4b1020;
      margin:20px 0;
    }

    input,textarea{
      width:100%;
      border:1px solid #ddd;
      border-radius:10px;
      padding:13px;
      margin-bottom:12px;
      font-size:15px;
      outline:none;
    }

    textarea{
      min-height:90px;
      resize:vertical;
    }

    .checkout{
      width:100%;
      border:0;
      background:#128c7e;
      color:#fff;
      padding:14px;
      border-radius:12px;
      font-size:16px;
      font-weight:bold;
      cursor:pointer;
    }

    .checkout:disabled{
      opacity:.6;
    }

    .message{
      padding:11px;
      border-radius:9px;
      margin-bottom:12px;
      text-align:center;
      display:none;
    }

    .success{
      display:block;
      background:#e5f8ed;
      color:#146c43;
    }

    .error{
      display:block;
      background:#ffe6e6;
      color:#a00000;
    }

    @media(max-width:800px){
      .products{
        grid-template-columns:repeat(2,1fr);
        gap:12px;
      }

      .product-image{
        height:135px;
        font-size:50px;
      }
    }

    @media(max-width:430px){
      .logo{
        font-size:16px;
      }

      .cart-button{
        padding:9px 12px;
        font-size:12px;
      }

      .card{
        padding:10px;
      }

      .card h3{
        font-size:15px;
      }

      .new{
        font-size:18px;
      }

      .product-image{
        height:120px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="nav">
    <div class="logo">✨ Mayuri General Store</div>

    <button class="cart-button" onclick="openCart()">
      🛒 Cart (<span id="cartCount">0</span>)
    </button>
  </div>
</header>


<section class="hero">
  <h1>Mayuri General Store</h1>
  <p>Quality Products • Best Prices • Easy Ordering</p>
</section>


<section class="section">

  <h2 class="title">🛍️ Shop Our Products</h2>

  <div class="categories">

    <button class="category active"
      onclick="setCategory('All',this)">
      All
    </button>

    <button class="category"
      onclick="setCategory('Stationery',this)">
      📚 Stationery
    </button>

    <button class="category"
      onclick="setCategory('Cosmetics',this)">
      💄 Cosmetics
    </button>

    <button class="category"
      onclick="setCategory('Artificial Jewellery',this)">
      💎 Jewellery
    </button>

    <button class="category"
      onclick="setCategory('Toys',this)">
      🧸 Toys
    </button>

    <button class="category"
      onclick="setCategory('General Items',this)">
      🛍️ General
    </button>

  </div>

  <div id="products" class="products">
    <div style="text-align:center;grid-column:1/-1;">
      Loading products...
    </div>
  </div>

</section>


<footer>
  <h3>Mayuri General Store</h3>
  <p style="margin-top:8px;">Thank you for shopping with us ❤️</p>
</footer>


<!-- CART -->

<div id="cartOverlay" class="overlay">

  <div class="modal">

    <div class="modal-head">
      <h2>🛒 Your Cart</h2>
      <button class="close" onclick="closeCart()">×</button>
    </div>

    <div id="cartItems"></div>

    <div class="total">
      <span>Total</span>
      <span>₹<span id="cartTotal">0</span></span>
    </div>

    <button class="checkout" onclick="openCheckout()">
      Proceed to Checkout →
    </button>

  </div>

</div>


<!-- CHECKOUT -->

<div id="checkoutOverlay" class="overlay">

  <div class="modal">

    <div class="modal-head">
      <h2>📦 Checkout</h2>
      <button class="close" onclick="closeCheckout()">×</button>
    </div>

    <div id="message" class="message"></div>

    <form id="checkoutForm">

      <input
        id="name"
        type="text"
        placeholder="Your Name"
        required
      >

      <input
        id="phone"
        type="tel"
        placeholder="10-digit Mobile Number"
        maxlength="10"
        pattern="[0-9]{10}"
        required
      >

      <textarea
        id="address"
        placeholder="Complete Delivery Address"
        required
      ></textarea>

      <div class="total">
        <span>Order Total</span>
        <span>₹<span id="checkoutTotal">0</span></span>
      </div>

      <button
        id="placeOrder"
        class="checkout"
        type="submit">
        🟢 Place Order & WhatsApp
      </button>

    </form>

  </div>

</div>


<script>

/* =========================================
   SUPABASE CONNECTION
========================================= */

const SUPABASE_URL =
  "https://inbhwgksryupmbujzciw.supabase.co";

const SUPABASE_ANON_KEY =
  "PASTE_YOUR_PUBLISHABLE_KEY_HERE";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


/* =========================================
   STORE SETTINGS
========================================= */

const WHATSAPP_NUMBER = "918223837338";

let products = [];

let cart = [];

let currentCategory = "All";


/* =========================================
   LOAD PRODUCTS FROM SUPABASE
========================================= */

async function loadProducts(){

  const box =
    document.getElementById("products");

  try{

    const {data,error} =
      await supabaseClient
        .from("products")
        .select("*")
        .order("created_at",{ascending:false});

    if(error) throw error;

    products = data || [];

    renderProducts();

  }catch(error){

    console.error(error);

    box.innerHTML = `
      <div style="grid-column:1/-1;text-align:center;">
        ❌ Products load nahi ho rahe.<br>
        Supabase connection check karo.
      </div>
    `;
  }
}


/* =========================================
   SHOW PRODUCTS
========================================= */

function renderProducts(){

  const box =
    document.getElementById("products");

  let list = products;

  if(currentCategory !== "All"){

    list =
      products.filter(
        p => p.category === currentCategory
      );
  }

  if(!list.length){

    box.innerHTML = `
      <div style="grid-column:1/-1;text-align:center;">
        Is category me abhi product available nahi hai.
      </div>
    `;

    return;
  }


  box.innerHTML =
    list.map(product => {

      let discount = 0;

      if(
        product.old_price &&
        product.old_price > product.price
      ){

        discount =
          Math.round(
            ((product.old_price-product.price) /
            product.old_price)*100
          );
      }


      return `

        <div class="card">

          <div class="product-image">
            💄
          </div>

          <h3>
            ${safe(product.name)}
          </h3>

          <div class="desc">
            ${safe(product.description || "")}
          </div>

          <div class="price">

            ${
              product.old_price
              ? `<span class="old">
                   ₹${product.old_price}
                 </span>`
              : ""
            }

            <span class="new">
              ₹${product.price}
            </span>

            ${
              discount
              ? `<div class="off">
                   ${discount}% OFF
                 </div>`
              : ""
            }

          </div>

          <button
            class="add"
            onclick="addToCart('${product.id}')">
            🛒 Add to Cart
          </button>

        </div>

      `;

    }).join("");
}


/* =========================================
   CATEGORY
========================================= */

function setCategory(category,button){

  currentCategory = category;

  document
    .querySelectorAll(".category")
    .forEach(
      b => b.classList.remove("active")
    );

  button.classList.add("active");

  renderProducts();
}


/* =========================================
   ADD CART
========================================= */

function addToCart(id){

  const product =
    products.find(
      p => String(p.id) === String(id)
    );

  if(!product) return;


  const existing =
    cart.find(
      item =>
        String(item.id) === String(product.id)
    );


  if(existing){

    existing.quantity++;

  }else{

    cart.push({
      id:product.id,
      name:product.name,
      price:Number(product.price),
      quantity:1
    });

  }

  updateCart();

}


/* =========================================
   CART QUANTITY
========================================= */

function changeQuantity(id,value){

  const item =
    cart.find(
      x => String(x.id) === String(id)
    );

  if(!item) return;

  item.quantity += value;

  if(item.quantity <= 0){

    cart =
      cart.filter(
        x => String(x.id) !== String(id)
      );
  }

  updateCart();
}


function removeItem(id){

  cart =
    cart.filter(
      x => String(x.id) !== String(id)
    );

  updateCart();
}


/* =========================================
   TOTAL
========================================= */

function getTotal(){

  return cart.reduce(
    (sum,item) =>
      sum + item.price * item.quantity,
    0
  );
}


/* =========================================
   UPDATE CART
========================================= */

function updateCart(){

  const count =
    cart.reduce(
      (sum,item) =>
        sum + item.quantity,
      0
    );

  document.getElementById("cartCount")
    .textContent = count;

  renderCart();
}


/* =========================================
   RENDER CART
========================================= */

function renderCart(){

  const box =
    document.getElementById("cartItems");


  if(!cart.length){

    box.innerHTML = `
      <div style="text-align:center;padding:30px;color:#777;">
        🛒 Your cart is empty.
      </div>
    `;

  }else{

    box.innerHTML =
      cart.map(item => `

        <div class="cart-item">

          <div>

            <strong>
              ${safe(item.name)}
            </strong>

            <div>
              ₹${item.price}
            </div>

            <div class="quantity">

              <button
                onclick="changeQuantity('${item.id}',-1)">
                −
              </button>

              <span>${item.quantity}</span>

              <button
                onclick="changeQuantity('${item.id}',1)">
                +
              </button>

              <button
                class="remove"
                onclick="removeItem('${item.id}')">
                Remove
              </button>

            </div>

          </div>

          <strong>
            ₹${item.price * item.quantity}
          </strong>

        </div>

      `).join("");
  }


  document.getElementById("cartTotal")
    .textContent = getTotal();

  document.getElementById("checkoutTotal")
    .textContent = getTotal();
}


/* =========================================
   CART MODAL
========================================= */

function openCart(){

  renderCart();

  document
    .getElementById("cartOverlay")
    .classList.add("show");
}


function closeCart(){

  document
    .getElementById("cartOverlay")
    .classList.remove("show");
}


/* =========================================
   CHECKOUT
========================================= */

function openCheckout(){

  if(!cart.length){

    alert("🛒 Pehle product cart me add karo.");

    return;
  }

  closeCart();

  document
    .getElementById("checkoutOverlay")
    .classList.add("show");

  document.getElementById("checkoutTotal")
    .textContent = getTotal();
}


function closeCheckout(){

  document
    .getElementById("checkoutOverlay")
    .classList.remove("show");
}


/* =========================================
   PLACE ORDER
========================================= */

document
  .getElementById("checkoutForm")
  .addEventListener("submit",async function(e){

    e.preventDefault();


    if(!cart.length){

      alert("Cart empty hai.");

      return;
    }


    const name =
      document.getElementById("name")
        .value.trim();

    const phone =
      document.getElementById("phone")
        .value.trim();

    const address =
      document.getElementById("address")
        .value.trim();

    const button =
      document.getElementById("placeOrder");

    const messageBox =
      document.getElementById("message");


    if(!/^[0-9]{10}$/.test(phone)){

      messageBox.className =
        "message error";

      messageBox.textContent =
        "❌ Valid 10-digit mobile number enter karo.";

      return;
    }


    button.disabled = true;

    button.textContent =
      "⏳ Saving Order...";


    const total = getTotal();


    const items =
      cart.map(item => ({
        product_id:item.id,
        name:item.name,
        price:item.price,
        quantity:item.quantity,
        subtotal:item.price * item.quantity
      }));


    try{

      const {data,error} =
        await supabaseClient
          .from("orders")
          .insert([{

            customer_name:name,

            phone:phone,

            address:address,

            total:total,

            items:items,

            status:"Pending"

          }])
          .select("id")
          .single();


      if(error) throw error;


      const orderId = data.id;


      /* WhatsApp message */

      let text =
`🛍️ *Mayuri General Store*

📦 *Order ID:* #${orderId}

👤 *Customer:* ${name}
📱 *Phone:* ${phone}

*Products:*`;


      cart.forEach(item => {

        text +=
`\n• ${item.name} × ${item.quantity} = ₹${item.price * item.quantity}`;

      });


      text +=
`\n\n💰 *Total: ₹${total}*

📍 *Address:*
${address}

Please confirm my order. Thank you!`;


      const whatsapp =
        "https://wa.me/" +
        WHATSAPP_NUMBER +
        "?text=" +
        encodeURIComponent(text);


      messageBox.className =
        "message success";

      messageBox.textContent =
        "✅ Order saved! WhatsApp opening...";


      cart = [];

      updateCart();

      document
        .getElementById("checkoutForm")
        .reset();


      setTimeout(function(){

        window.location.href = whatsapp;

      },700);


    }catch(error){

      console.error(error);

      messageBox.className =
        "message error";

      messageBox.textContent =
        "❌ Order save nahi hua: " +
        (error.message || "Unknown error");


      button.disabled = false;

      button.textContent =
        "🟢 Place Order & WhatsApp";
    }

  });


/* =========================================
   BASIC HTML SAFETY
========================================= */

function safe(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


/* =========================================
   START WEBSITE
========================================= */

loadProducts();

</script>

</body>
</html>
