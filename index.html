<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mayuri General Store</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #faf7f5;
      color: #2b1720;
      line-height: 1.6;
    }

    /* ================= HEADER ================= */

    header {
      position: sticky;
      top: 0;
      z-index: 999;
      background: #3b101d;
      border-bottom: 1px solid #c9a227;
      padding: 14px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      color: #d8b33d;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: .5px;
    }

    nav {
      display: flex;
      gap: 18px;
    }

    nav a {
      color: #fff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
    }

    nav a:hover {
      color: #e0bd4a;
    }

    /* ================= HERO / BANNER ================= */

    .hero {
      min-height: 75vh;
      padding: 80px 6%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: white;

      background:
        radial-gradient(circle at 20% 20%, rgba(210,170,50,.18), transparent 30%),
        radial-gradient(circle at 80% 80%, rgba(210,170,50,.12), transparent 30%),
        linear-gradient(135deg, #2b0714, #551528, #300914);

      position: relative;
      overflow: hidden;
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 20px;
      border: 1px solid rgba(216,179,61,.35);
      pointer-events: none;
    }

    .hero-content {
      max-width: 800px;
      position: relative;
      z-index: 2;
    }

    .hero small {
      color: #e0bd4a;
      letter-spacing: 4px;
      font-weight: bold;
    }

    .hero h1 {
      font-size: clamp(38px, 7vw, 70px);
      line-height: 1.1;
      margin: 18px 0;
    }

    .hero h1 span {
      color: #d9b43c;
    }

    .hero p {
      max-width: 650px;
      margin: auto;
      color: #f1e8e8;
      font-size: 16px;
    }

    .actions {
      margin-top: 30px;
    }
